<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Cape Housing Atlas Matching Platform",
  "schemaVersion": 1,
  "description": "MassHCIC Cape Housing Atlas matching platform: sample hosts, residents (x), potential matches with approve/deny/begin-pairing workflow, application status tracker, and a key explaining host types."
}
</script>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MassHCIC Cape Housing Atlas — Matching Platform</title>
<style>
  :root{ color-scheme: light;
    --bg:#F5F4F0; --surface:#FFFFFF; --surface-2:#FAF9F6;
    --border:#E1DFD6; --border-strong:#C9C6B8;
    --text:#22261F; --text-secondary:#5B5A50; --text-muted:#8A8878;
    --accent:#2E5E4E; --accent-light:#E1EEE8; --accent-text:#1E4437;
    --green:#3B6D11; --green-bg:#EAF3DE;
    --amber:#854F0B; --amber-bg:#FAEEDA;
    --red:#A32D2D; --red-bg:#FCEBEB;
    --blue:#185FA5; --blue-bg:#E6F1FB;
    --gray-bg:#F1EFE8; --gray-text:#5F5E5A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  .wrap{max-width:1080px;margin:0 auto;padding:2rem 1.5rem 4rem;}
  header{margin-bottom:1.5rem;}
  header h1{font-size:22px;font-weight:600;margin:0 0 4px;color:var(--text);}
  header p{font-size:14px;color:var(--text-secondary);margin:0;}
  .statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:1.25rem 0 1.75rem;}
  .stat{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .stat .n{font-size:22px;font-weight:600;}
  .stat .l{font-size:12.5px;color:var(--text-secondary);margin-top:2px;}
  nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:1.5rem;}
  nav.tabs button{appearance:none;background:none;border:none;padding:10px 16px;font-size:14px;font-weight:500;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  nav.tabs button.active{color:var(--accent-text);border-bottom:2px solid var(--accent);}
  nav.tabs button .badge{display:inline-block;background:var(--gray-bg);color:var(--gray-text);font-size:11px;font-weight:600;padding:1px 6px;border-radius:8px;margin-left:6px;}
  .panel{display:none;}
  .panel.active{display:block;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;}
  .card{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:14px 16px;}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
  .card .name{font-size:15px;font-weight:600;}
  .card .sub{font-size:12.5px;color:var(--text-secondary);margin-top:1px;}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .pill.type2{background:var(--accent-light);color:var(--accent-text);}
  .pill.type3{background:var(--blue-bg);color:var(--blue);}
  .pill.cleared{background:var(--green-bg);color:var(--green);}
  .pill.notreq{background:var(--gray-bg);color:var(--gray-text);}
  .pill.pending{background:var(--amber-bg);color:var(--amber);}
  .pill.failed{background:var(--red-bg);color:var(--red);}
  .rows{margin-top:10px;border-top:0.5px solid var(--border);padding-top:10px;font-size:13px;}
  .rows div{display:flex;justify-content:space-between;padding:3px 0;color:var(--text-secondary);}
  .rows div b{color:var(--text);font-weight:500;}
  .rows .avail{color:var(--text-secondary);margin-top:4px;line-height:1.5;display:block;}
  .matchcard{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:12px;}
  .matchhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .matchpair{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;}
  .matchpair i{color:var(--text-muted);font-size:16px;}
  .reasons{font-size:13px;color:var(--text-secondary);margin-top:8px;line-height:1.6;}
  .actions{display:flex;gap:8px;margin-top:12px;}
  button.act{appearance:none;border:0.5px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text);}
  button.act:hover{background:var(--surface-2);}
  button.approve{border-color:var(--green);color:var(--green);}
  button.deny{border-color:var(--red);color:var(--red);}
  button.pair{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.pair:hover{background:var(--accent-text);}
  button.reset{color:var(--text-secondary);}
  .statusbadge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;}
  .statusbadge.status-pending{background:var(--amber-bg);color:var(--amber);}
  .statusbadge.status-approved{background:var(--blue-bg);color:var(--blue);}
  .statusbadge.status-paired{background:var(--green-bg);color:var(--green);}
  .statusbadge.status-denied{background:var(--red-bg);color:var(--red);}
  .filterrow{display:flex;gap:8px;margin-bottom:1rem;}
  .filterrow button{appearance:none;border:0.5px solid var(--border);background:var(--surface);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--text-secondary);}
  .filterrow button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .empty{color:var(--text-muted);font-size:13px;padding:2rem 0;text-align:center;}
  .paireddate{font-size:12.5px;color:var(--green);margin-top:6px;}
  .statustable{width:100%;border-collapse:collapse;font-size:13.5px;}
  .statustable th{text-align:left;font-size:11.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em;padding:6px 10px;border-bottom:1px solid var(--border);}
  .statustable td{padding:9px 10px;border-bottom:0.5px solid var(--border);vertical-align:middle;}
  .statustable .sub{color:var(--text-secondary);font-size:12px;}
  .sectionlabel{font-size:13px;font-weight:600;color:var(--text-secondary);margin:1.5rem 0 .5rem;text-transform:uppercase;letter-spacing:.02em;}
  .sectionlabel:first-child{margin-top:0;}
  .keycard{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:12px;}
  .keycard .kt{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .keycard .kt .name{font-size:14.5px;font-weight:600;}
  .keycard p{font-size:13.5px;color:var(--text-secondary);line-height:1.6;margin:0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MassHCIC Cape Housing Atlas — matching platform</h1>
    <p>Prototype workspace for the Consultant to review hosts, residents (x), and potential matches.</p>
  </header>

  <div class="statrow" id="statrow"></div>

  <nav class="tabs">
    <button data-tab="hosts" class="active">Hosts <span class="badge" id="hostcount"></span></button>
    <button data-tab="residents">Residents (x) <span class="badge" id="rescount"></span></button>
    <button data-tab="matches">Potential matches <span class="badge" id="matchcount"></span></button>
    <button data-tab="status">Application status</button>
    <button data-tab="key">Key</button>
  </nav>

  <div class="panel active" id="panel-hosts"><div class="grid" id="hostsGrid"></div></div>
  <div class="panel" id="panel-residents"><div class="grid" id="residentsGrid"></div></div>
  <div class="panel" id="panel-matches">
    <div class="filterrow" id="filterRow"></div>
    <div id="matchesList"></div>
  </div>
  <div class="panel" id="panel-status">
    <div class="sectionlabel">Residents (x)</div>
    <table class="statustable" id="statusResidentsTable"></table>
    <div class="sectionlabel">Hosts</div>
    <table class="statustable" id="statusHostsTable"></table>
  </div>
  <div class="panel" id="panel-key">
    <div class="sectionlabel">Host types</div>
    <div id="keyHostTypes"></div>
    <div class="sectionlabel">Home type</div>
    <div id="keyHomeTypes"></div>
    <div class="sectionlabel">Background check status</div>
    <div id="keyBgStatus"></div>
    <div class="sectionlabel">Application status</div>
    <div id="keyAppStatus"></div>
  </div>
</div>

<script>
const REGION = {
  Bourne:"Upper Cape", Falmouth:"Upper Cape", Mashpee:"Upper Cape", Sandwich:"Upper Cape",
  Barnstable:"Mid Cape", Dennis:"Mid Cape", Yarmouth:"Mid Cape",
  Brewster:"Lower Cape", Chatham:"Lower Cape", Harwich:"Lower Cape", Orleans:"Lower Cape",
  Eastham:"Outer Cape", Provincetown:"Outer Cape", Truro:"Outer Cape", Wellfleet:"Outer Cape"
};

const HOSTS = [
  {id:"H001", name:"Margaret Sullivan", type:"Host Type 2", homeType:"Whole home", municipality:"Barnstable", rent:1800, bg:"Not required", availability:"Open Sept–May. Blocks Thanksgiving week, Christmas week, and the last week of August for personal use; keeps Airbnb income the rest of the summer."},
  {id:"H002", name:"Diane Costa", type:"Host Type 3", homeType:"Private room", municipality:"Yarmouth", rent:900, bg:"Cleared", availability:"Open year-round except the month of July, when a visiting relative stays."},
  {id:"H003", name:"Robert Nguyen", type:"Host Type 2", homeType:"Whole home", municipality:"Chatham", rent:2000, bg:"Not required", availability:"Open Sept–May. Blocks June–August for Airbnb season."},
  {id:"H004", name:"Elaine Ferreira", type:"Host Type 3", homeType:"Private room", municipality:"Falmouth", rent:850, bg:"Cleared", availability:"Open year-round, no blocked weeks currently."},
  {id:"H005", name:"Walter Silva", type:"Host Type 2", homeType:"Whole home", municipality:"Dennis", rent:1700, bg:"Not required", availability:"Open most of the year. Blocks the week of July 4th and the week of Easter."},
  {id:"H006", name:"Priya Nair", type:"Host Type 3", homeType:"Private room", municipality:"Harwich", rent:950, bg:"Scheduled", availability:"Open year-round except February school vacation week."},
  {id:"H007", name:"Thomas O'Brien", type:"Host Type 2", homeType:"Whole home", municipality:"Brewster", rent:1900, bg:"Not required", availability:"Open Sept–May. Blocks Christmas week and New Year's week."},
  {id:"H008", name:"Susan Whitcomb", type:"Host Type 3", homeType:"Private room", municipality:"Sandwich", rent:875, bg:"Cleared", availability:"Open year-round, no blocked weeks currently."},
  {id:"H009", name:"Carlos Mendes", type:"Host Type 2", homeType:"Whole home", municipality:"Mashpee", rent:1750, bg:"Not required", availability:"Open Sept–May. Blocks the last two weeks of August."},
  {id:"H010", name:"Nancy Doyle", type:"Host Type 3", homeType:"Private room", municipality:"Orleans", rent:900, bg:"Cleared", availability:"Open year-round except Thanksgiving week."}
];

const RESIDENTS = [
  {id:"R001", name:"Jordan Reyes", profession:"Teacher", employer:"Barnstable Public Schools", municipality:"Barnstable", budget:1200, household:1, bg:"Cleared"},
  {id:"R002", name:"Maria Lopez", profession:"Healthcare", employer:"Cape Cod Hospital", municipality:"Barnstable", budget:1400, household:1, bg:"Cleared"},
  {id:"R003", name:"David Chen", profession:"Police", employer:"Yarmouth Police Dept.", municipality:"Yarmouth", budget:1300, household:2, bg:"Cleared"},
  {id:"R004", name:"Sarah Kim", profession:"Fire", employer:"Falmouth Fire Dept.", municipality:"Falmouth", budget:1250, household:1, bg:"Scheduled"},
  {id:"R005", name:"Michael Brooks", profession:"Government/Municipal", employer:"Town of Dennis", municipality:"Dennis", budget:1100, household:1, bg:"Cleared"},
  {id:"R006", name:"Emily Tran", profession:"Teacher", employer:"Chatham Elementary", municipality:"Chatham", budget:1350, household:2, bg:"Cleared"},
  {id:"R007", name:"James Walsh", profession:"Healthcare", employer:"Cape Cod Healthcare", municipality:"Harwich", budget:1450, household:1, bg:"Not started"},
  {id:"R008", name:"Olivia Martins", profession:"Police", employer:"Barnstable Police Dept.", municipality:"Barnstable", budget:1300, household:1, bg:"Cleared"},
  {id:"R009", name:"Daniel Souza", profession:"Fire", employer:"Barnstable Fire Dept.", municipality:"Barnstable", budget:1200, household:1, bg:"Cleared"},
  {id:"R010", name:"Grace Lee", profession:"Government/Municipal", employer:"Town of Brewster", municipality:"Brewster", budget:1150, household:1, bg:"Scheduled"},
  {id:"R011", name:"Kevin Alves", profession:"Teacher", employer:"Mashpee Middle School", municipality:"Mashpee", budget:1250, household:1, bg:"Cleared"},
  {id:"R012", name:"Rachel Foster", profession:"Healthcare", employer:"Falmouth Hospital", municipality:"Falmouth", budget:1400, household:2, bg:"Cleared"},
  {id:"R013", name:"Anthony Dias", profession:"Police", employer:"Dennis Police Dept.", municipality:"Dennis", budget:1300, household:1, bg:"Not started"},
  {id:"R014", name:"Lauren Pereira", profession:"Fire", employer:"Sandwich Fire Dept.", municipality:"Sandwich", budget:1200, household:1, bg:"Cleared"},
  {id:"R015", name:"Brian Cabral", profession:"Government/Municipal", employer:"Town of Orleans", municipality:"Orleans", budget:1150, household:1, bg:"Cleared"}
];

function bgOk(v){ return v === "Cleared" || v === "Not required"; }

function scoreMatch(res, host){
  let score = 0;
  const reasons = [];
  if (res.municipality === host.municipality){ score += 50; reasons.push("Same town (" + host.municipality + ")"); }
  else if (REGION[res.municipality] === REGION[host.municipality]){ score += 25; reasons.push("Same sub-region (" + REGION[host.municipality] + ")"); }
  else { reasons.push("Different region — longer commute"); }
  if (host.rent <= res.budget){ score += 30; reasons.push("Rent $" + host.rent + " fits budget $" + res.budget); }
  else { score -= 15; reasons.push("Rent $" + host.rent + " is above stated budget $" + res.budget); }
  if (bgOk(res.bg) && bgOk(host.bg)){ score += 20; reasons.push("Both background checks cleared or not required"); }
  else { reasons.push("Background check still pending on one or both sides"); }
  return {score, reasons};
}

function buildMatches(){
  const matches = [];
  let mid = 1;
  RESIDENTS.forEach(res => {
    let best = null;
    HOSTS.forEach(host => {
      const {score, reasons} = scoreMatch(res, host);
      if (!best || score > best.score) best = {host, score, reasons};
    });
    if (best && best.score >= 30){
      matches.push({
        id: "PM" + String(mid++).padStart(3,"0"),
        residentId: res.id, hostId: best.host.id,
        score: best.score, reasons: best.reasons,
        status: "pending", pairedOn: null
      });
    }
  });
  return matches;
}

let MATCHES = buildMatches();
let activeFilter = "all";

function byId(arr, id){ return arr.find(x => x.id === id); }

function pillClassForBg(bg){
  if (bg === "Cleared") return "cleared";
  if (bg === "Not required") return "notreq";
  if (bg === "Not started") return "failed";
  return "pending";
}

function renderStats(){
  const approved = MATCHES.filter(m => m.status === "approved").length;
  const paired = MATCHES.filter(m => m.status === "paired").length;
  const pending = MATCHES.filter(m => m.status === "pending").length;
  document.getElementById("statrow").innerHTML = [
    ["10", "Hosts"], ["15", "Residents (x)"],
    [String(pending), "Pending review"], [String(paired), "Active pairings"]
  ].map(([n,l]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
}

function renderHosts(){
  document.getElementById("hostcount").textContent = HOSTS.length;
  document.getElementById("hostsGrid").innerHTML = HOSTS.map(h => `
    <div class="card">
      <div class="top">
        <div><div class="name">${h.name}</div><div class="sub">${h.municipality} · ${h.homeType}</div></div>
        <span class="pill ${h.type === 'Host Type 2' ? 'type2' : 'type3'}">${h.type}</span>
      </div>
      <div class="rows">
        <div>Rent / income target <b>$${h.rent.toLocaleString()}/mo</b></div>
        <div>Background check <span class="pill ${pillClassForBg(h.bg)}">${h.bg}</span></div>
        <span class="avail">${h.availability}</span>
      </div>
    </div>`).join("");
}

function renderResidents(){
  document.getElementById("rescount").textContent = RESIDENTS.length;
  document.getElementById("residentsGrid").innerHTML = RESIDENTS.map(r => `
    <div class="card">
      <div class="top">
        <div><div class="name">${r.name}</div><div class="sub">${r.employer}</div></div>
        <span class="pill type2">${r.profession}</span>
      </div>
      <div class="rows">
        <div>Municipality <b>${r.municipality}</b></div>
        <div>Household size <b>${r.household}</b></div>
        <div>Budget <b>$${r.budget.toLocaleString()}/mo</b></div>
        <div>Background check <span class="pill ${pillClassForBg(r.bg)}">${r.bg}</span></div>
      </div>
    </div>`).join("");
}

function renderFilters(){
  const counts = {
    all: MATCHES.length,
    pending: MATCHES.filter(m=>m.status==="pending").length,
    approved: MATCHES.filter(m=>m.status==="approved").length,
    paired: MATCHES.filter(m=>m.status==="paired").length,
    denied: MATCHES.filter(m=>m.status==="denied").length
  };
  const labels = {all:"All", pending:"Pending", approved:"Approved", paired:"Paired", denied:"Denied"};
  document.getElementById("filterRow").innerHTML = Object.keys(labels).map(k =>
    `<button data-filter="${k}" class="${activeFilter===k?'active':''}">${labels[k]} (${counts[k]})</button>`
  ).join("");
  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.addEventListener("click", () => { activeFilter = btn.dataset.filter; renderAll(); });
  });
}

function renderMatches(){
  document.getElementById("matchcount").textContent = MATCHES.length;
  const list = activeFilter === "all" ? MATCHES : MATCHES.filter(m => m.status === activeFilter);
  const el = document.getElementById("matchesList");
  if (list.length === 0){ el.innerHTML = '<div class="empty">No matches in this view.</div>'; return; }
  el.innerHTML = list.map(m => {
    const res = byId(RESIDENTS, m.residentId);
    const host = byId(HOSTS, m.hostId);
    let actions = "";
    if (m.status === "pending"){
      actions = `<button class="act approve" data-act="approve" data-id="${m.id}">Approve</button>
                 <button class="act deny" data-act="deny" data-id="${m.id}">Deny</button>`;
    } else if (m.status === "approved"){
      actions = `<button class="act pair" data-act="pair" data-id="${m.id}">Begin pairing</button>
                 <button class="act reset" data-act="reset" data-id="${m.id}">Reset</button>`;
    } else {
      actions = `<button class="act reset" data-act="reset" data-id="${m.id}">Reset to pending</button>`;
    }
    return `<div class="matchcard">
      <div class="matchhead">
        <div class="matchpair">${res.name} &rarr; ${host.name}
          <span class="pill ${host.type === 'Host Type 2' ? 'type2' : 'type3'}">${host.type}</span>
        </div>
        <span class="statusbadge status-${m.status}">${m.status.charAt(0).toUpperCase()+m.status.slice(1)}</span>
      </div>
      <div class="reasons">${m.reasons.join(" · ")}</div>
      ${m.status === "paired" ? `<div class="paireddate">Pairing active as of ${m.pairedOn}</div>` : ""}
      <div class="actions">${actions}</div>
    </div>`;
  }).join("");

  el.querySelectorAll("[data-act]").forEach(btn => {
    btn.addEventListener("click", () => {
      const m = byId(MATCHES, btn.dataset.id);
      const act = btn.dataset.act;
      if (act === "approve") m.status = "approved";
      if (act === "deny") m.status = "denied";
      if (act === "reset"){ m.status = "pending"; m.pairedOn = null; }
      if (act === "pair"){
        m.status = "paired";
        m.pairedOn = new Date().toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"});
      }
      renderAll();
    });
  });
}

const STATUS_META = {
  bg_pending:   {label:"Waiting on background check", cls:"pending"},
  waiting_match:{label:"Waiting for a match",          cls:"notreq"},
  match_review: {label:"Match found — awaiting review",cls:"type3"},
  match_approved:{label:"Match approved — awaiting pairing", cls:"type3"},
  active_res:   {label:"Actively paired",  cls:"cleared"},
  active_host:  {label:"Actively hosting", cls:"cleared"},
  match_denied: {label:"Previous match denied — re-matching", cls:"failed"}
};

function computeStatusKey(bg, bgRequired, personMatches){
  if (bgRequired && !bgOk(bg)) return "bg_pending";
  if (personMatches.length === 0) return "waiting_match";
  if (personMatches.some(m => m.status === "paired")) return "active";
  if (personMatches.some(m => m.status === "approved")) return "match_approved";
  if (personMatches.some(m => m.status === "pending")) return "match_review";
  return "match_denied";
}

function renderStatusPage(){
  const resRows = RESIDENTS.map(r => {
    const key = computeStatusKey(r.bg, true, MATCHES.filter(m => m.residentId === r.id));
    const meta = STATUS_META[key === "active" ? "active_res" : key];
    return `<tr><td><b>${r.name}</b><div class="sub">${r.profession} · ${r.municipality}</div></td>
      <td><span class="pill ${pillClassForBg(r.bg)}">${r.bg}</span></td>
      <td><span class="pill ${meta.cls}">${meta.label}</span></td></tr>`;
  }).join("");
  document.getElementById("statusResidentsTable").innerHTML =
    `<tr><th>Resident</th><th>Background check</th><th>Application status</th></tr>${resRows}`;

  const hostRows = HOSTS.map(h => {
    const bgRequired = h.bg !== "Not required";
    const key = computeStatusKey(h.bg, bgRequired, MATCHES.filter(m => m.hostId === h.id));
    const meta = STATUS_META[key === "active" ? "active_host" : key];
    return `<tr><td><b>${h.name}</b><div class="sub">${h.type} · ${h.municipality}</div></td>
      <td><span class="pill ${pillClassForBg(h.bg)}">${h.bg}</span></td>
      <td><span class="pill ${meta.cls}">${meta.label}</span></td></tr>`;
  }).join("");
  document.getElementById("statusHostsTable").innerHTML =
    `<tr><th>Host</th><th>Background check</th><th>Application status</th></tr>${hostRows}`;
}

function renderKeyPage(){
  document.getElementById("keyHostTypes").innerHTML = `
    <div class="keycard"><div class="kt"><span class="pill type2">Host Type 2</span><span class="name">Inherited / seasonal owner</span></div>
      <p>Owns a home on the Cape — often inherited — and personally uses it only a handful of weeks a year. Already rents the home on Airbnb each summer; the platform's appeal is putting the off-season, when the home would otherwise sit vacant, to work. Usually offers the whole home rather than a shared room.</p></div>
    <div class="keycard"><div class="kt"><span class="pill type3">Host Type 3</span><span class="name">Empty-nester room host</span></div>
      <p>A year-round Cape resident, often living alone, with unused bedrooms in an otherwise occupied home. Offers a private room in a shared-living, host-family style arrangement rather than a whole home. Because they live in the home, this arrangement always requires a background check.</p></div>`;
  document.getElementById("keyHomeTypes").innerHTML = `
    <div class="keycard"><p><b>Whole home</b> — the resident (x) has the entire property to themselves; typical of Host Type 2. <b>Private room</b> — the resident shares a home with the host, who continues to live there; typical of Host Type 3.</p></div>`;
  document.getElementById("keyBgStatus").innerHTML = `
    <div class="keycard"><p>
      <span class="pill cleared">Cleared</span> iCORI background check complete and passed. &nbsp;
      <span class="pill pending">Scheduled</span> check is booked but not yet complete. &nbsp;
      <span class="pill failed">Not started</span> check hasn't been initiated. &nbsp;
      <span class="pill notreq">Not required</span> this person doesn't need one for their current role (e.g., a Host Type 2 owner who won't be living alongside the resident).
    </p></div>`;
  document.getElementById("keyAppStatus").innerHTML = `
    <div class="keycard"><p>
      <span class="pill pending">Waiting on background check</span> a required check isn't cleared yet — nothing else can proceed. &nbsp;
      <span class="pill notreq">Waiting for a match</span> cleared, but not yet linked to a potential match. &nbsp;
      <span class="pill type3">Match found — awaiting review</span> a potential match exists and needs the Consultant's approve/deny decision. &nbsp;
      <span class="pill type3">Match approved — awaiting pairing</span> approved; the Consultant still needs to click Begin pairing. &nbsp;
      <span class="pill cleared">Actively paired / hosting</span> the pairing is live. &nbsp;
      <span class="pill failed">Previous match denied — re-matching</span> the last suggested match was denied and a new one is needed.
    </p></div>`;
}

function renderAll(){
  renderStats();
  renderHosts();
  renderResidents();
  renderFilters();
  renderMatches();
  renderStatusPage();
}
renderKeyPage();

document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
  });
});

renderAll();
</script>
</body>
</html>
